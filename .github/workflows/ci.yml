name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff flake8

      - name: Run ruff check
        run: ruff check app/ tests/ --select E,F,W --ignore E501

      - name: Run flake8
        run: flake8 app/ --max-line-length=120 --extend-ignore=E203,W503

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: tta_dev
          POSTGRES_PASSWORD: tta_dev_pass
          POSTGRES_DB: tta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://tta_dev:tta_dev_pass@localhost:5432/tta_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-test-secret-key-not-for-production
      JWT_REFRESH_SECRET_KEY: ci-test-refresh-secret-key
      WECHAT_PAY_MOCK: "True"
      FILE_STORAGE_MOCK: "True"
      AI_INFERENCE_MOCK: "True"
      LLM_ENABLED: "False"
      ADMIN_USER_IDS: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run Alembic migrations
        run: |
          alembic upgrade head

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --tb=short --cov=app --cov-report=term-missing --cov-fail-under=70

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: tta_dev
          POSTGRES_PASSWORD: tta_dev_pass
          POSTGRES_DB: tta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://tta_dev:tta_dev_pass@localhost:5432/tta_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-test-secret-key-not-for-production
      JWT_REFRESH_SECRET_KEY: ci-test-refresh-secret-key
      WECHAT_PAY_MOCK: "True"
      FILE_STORAGE_MOCK: "True"
      AI_INFERENCE_MOCK: "True"
      LLM_ENABLED: "False"
      ADMIN_USER_IDS: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short

  e2e-tests:
    name: E2E + Smoke + Security Tests
    runs-on: ubuntu-latest
    needs: integration-tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: tta_dev
          POSTGRES_PASSWORD: tta_dev_pass
          POSTGRES_DB: tta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://tta_dev:tta_dev_pass@localhost:5432/tta_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-test-secret-key-not-for-production
      JWT_REFRESH_SECRET_KEY: ci-test-refresh-secret-key
      WECHAT_PAY_MOCK: "True"
      FILE_STORAGE_MOCK: "True"
      AI_INFERENCE_MOCK: "True"
      LLM_ENABLED: "False"
      ADMIN_USER_IDS: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run E2E + Smoke + Security tests
        run: pytest tests/e2e/test_smoke.py tests/e2e/test_security.py tests/e2e/test_e2e_flows.py -v --tb=short
