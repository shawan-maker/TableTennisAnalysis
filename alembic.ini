# Alembic Configuration - TableTennisAnalysis
# Uses SQLAlchemy 2.0 async engine

[alembic]
# Migration scripts location
script_location = alembic

# Prepend repo root to sys.path so the `alembic` console script (CI Linux bin/alembic,
# which does NOT add CWD to sys.path) can import app.* modules required by env.py
prepend_sys_path = .

# Template file
# file_template = %%(rev)s_%%(slug)s

# Timezone
timezone = UTC

# Database URL (overridden by env.py from .env at runtime)
sqlalchemy.url = postgresql://tta_user:tta_pass_dev@192.168.40.147:5432/tta


[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
