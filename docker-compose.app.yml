# =============================================================================
# docker-compose.app.yml — 后端全栈容器编排（api + worker + beat + migrate 工具）
# 部署位置：虚拟机 /root/tta-app/docker-compose.app.yml（与 .env 同目录）
# 使用方式：cd /root/tta-app && docker compose -f docker-compose.app.yml up -d
#
# 网络模式 host —— CentOS 7 单机部署最稳：
#   * 直连宿主机已发布的 5432/6379（PG/Redis 由 02 文档的独立 compose 管理）
#   * api 直接绑定宿主机 8000，无 NAT / 无跨 compose 网络发现
#   * 与本机开发 .env 的主机地址 192.168.40.147 完全一致，.env 可原样复用
# 依赖前提：tta-db-dev / tta-redis-dev 运行且 healthy（01/02 文档）
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # FastAPI 应用（REST + WebSocket /ws）
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: tta-backend:latest
    container_name: tta-api
    network_mode: host
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Celery worker（DEBUG=true 时 task_always_eager 同步执行，worker 待命；
  # 切 DEBUG=false 后接管异步任务——视频分析流水线 / 定时清理等）
  # ---------------------------------------------------------------------------
  worker:
    image: tta-backend:latest
    container_name: tta-worker
    network_mode: host
    env_file: .env
    restart: unless-stopped
    command: celery -A app.core.celery worker --loglevel=info --concurrency=2
    depends_on:
      api:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Celery beat（定时任务调度；schedule 文件放 /tmp 规避工作区写权限问题）
  # ---------------------------------------------------------------------------
  beat:
    image: tta-backend:latest
    container_name: tta-beat
    network_mode: host
    env_file: .env
    restart: unless-stopped
    command: celery -A app.core.celery beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    depends_on:
      api:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 一次性迁移 + 种子数据工具（profiles 隔离，不随 up -d 启动）
  #   执行：docker compose -f docker-compose.app.yml run --rm migrate
  #   幂等：alembic upgrade head 重复执行无副作用；种子脚本自带「存在即跳过」
  # ---------------------------------------------------------------------------
  migrate:
    image: tta-backend:latest
    network_mode: host
    env_file: .env
    profiles: ["tools"]
    command: sh -c "alembic upgrade head && python scripts/init_knowledge_base.py && python scripts/seed_badges.py"
