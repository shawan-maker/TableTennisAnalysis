# pytest 配置 — 乒乓智能分析平台
# 依据：切片 13-infrastructure/pytest_config.md

[pytest]
# asyncio 模式
asyncio_mode = auto
# R13-Test-N1: pytest-asyncio 0.24 — 每个测试函数使用独立事件循环
# （替代 conftest 中已废弃的自定义 session-scope event_loop fixture，
#  消除 fixture 与 loop 生命周期的竞态）
asyncio_default_fixture_loop_scope = function

# 测试路径
testpaths = tests

# 测试文件模式
python_files = test_*.py *_test.py

# 测试类/函数模式
python_classes = Test*
python_functions = test_*

# 覆盖率门控
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=70

# 标记
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    smoke: marks tests as smoke tests

# 过滤警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
